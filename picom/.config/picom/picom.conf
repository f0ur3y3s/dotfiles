shadow = true;
shadow-radius = 12;
shadow-opacity=0.75;
shadow-offset-x = -10;
shadow-offset-y = -10;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

backend = "glx";
vsync = true;

# Opacity
active-opacity = 1;
inactive-opacity = 0.85;
frame-opacity = 0.8;
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
    "window_type = 'dock'"
];
blur-method = "dual_kawase"


wintypes:
{
    dock = {
        shadow = false;
    };
};

opacity-rule = [
    "90:class_g = 'kitty' && focused",
    "70:class_g = 'kitty' && !focused",
    "100:class_g = 'Brave-browser'"
];
